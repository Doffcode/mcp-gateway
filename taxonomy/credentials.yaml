category: credentials
actions:
  - {re: '\b(open|read|cat|display|fetch|retrieve|access|load|download|copy|steal|grab|extract|dump|leak|exfiltrate|send|upload|share|expose|reveal|harvest)\b', source: cisco-mcp-scanner@5d147dc/credential_harvesting}
  - {re: '\b(include|append|print|show|output|collect|index|store|log|record|validate|verify)\b', source: mcptox-train}
  - {re: '\bsteal\b', source: qsag-core@0.2.2}
targets:
  - {re: '\b(passwords?|passwd|secrets?|credentials?|tokens?|api[ _-]?keys?|private[ _-]?keys?|access[ _-]?keys?|ssh[ _-]?keys?)\b', source: cisco-mcp-scanner@5d147dc/tool_poisoning}
  - {re: '\b(id_rsa|id_dsa|id_ecdsa|id_ed25519|authorized_keys|known_hosts|credentials\.json|service_account\.json|aws_secret\w*)\b', source: cisco-mcp-scanner@5d147dc/credential_harvesting}
  - {re: '[/\\]\.(ssh|aws|kube)\b|~[/\\]\.env\b|\.cursor[/\\]mcp\.json', source: qsag-core@0.2.2}
  - {re: '\b(environment variables?|env vars?|print ?env|getenv|os\.environ|process\.env)\b', source: cisco-mcp-scanner@5d147dc/credential_harvesting}
  - {re: '\b(cookies?|session ids?|bearer|keychain)\b', source: mcptox-train}
schema_hints:
  - {re: '(pass(word)?|passwd|secret|token|api_?key|apikey|credential|auth|private_?key|access_?key)', source: mcp-fixture-hygiene}
