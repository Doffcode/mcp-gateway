[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Deterministic-first MCP metadata integrity gateway (L1 pinning + L2 capability consistency)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
agent = ["ollama>=0.4"]

[project.scripts]
gateway = "gateway.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
